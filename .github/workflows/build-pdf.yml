name: build docs PDF
on:
  workflow_dispatch:

concurrency:
  group: build-pdf
  cancel-in-progress: true

jobs:
  build:
    name: publish PDF
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python Env
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        cache: 'pip'
    - name: generate PDF
      run: |
        bash .github/scripts/generate-pdf.sh
        
