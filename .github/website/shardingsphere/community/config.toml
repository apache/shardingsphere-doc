baseURL = "https://shardingsphere.apache.org/community/"
title = "ShardingSphere Community"
theme = "hextra"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[languages.en]
label = "English"
locale = "en-US"
weight = 1

[languages.cn]
label = "简体中文"
locale = "zh-CN"
weight = 2

[cascade]
type = "docs"

[params]
siteKind = "community"
homeSection = "involved"

[params.navbar.logo]
path = "https://shardingsphere.apache.org/images/base/logo.png"
link = "https://shardingsphere.apache.org/"
width = 40
height = 40

[params.search.flexsearch]
js = "vendor/flexsearch.bundle.min.js"

[params.page.tabs]
sync = true

[params.page.contextMenu]
enable = true

[outputs]
page = ["HTML", "Markdown"]

[params.editURL]
enable = true
base = "https://github.com/apache/shardingsphere/edit/master/docs/community/content"

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[markup.goldmark.renderer]
unsafe = true
