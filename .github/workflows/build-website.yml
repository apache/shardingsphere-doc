name: CI_Deploy_WebSite

on:
  push:
    branches: [ asf-site ]
  pull_request:
    branches: [ asf-site ]
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * *'

concurrency:
  group: ci-deploy-website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
      
    - name: Setup Hugo for ElasticJob and OnCloud
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.83.1'
        extended: true

    - name: Setup Hugo for ShardingSphere
      run: |
        mkdir -p "$RUNNER_TEMP/shardingsphere-hugo"
        curl --fail --silent --show-error --location \
          https://github.com/gohugoio/hugo/releases/download/v0.169.0/hugo_extended_0.169.0_linux-amd64.tar.gz \
          --output "$RUNNER_TEMP/shardingsphere-hugo.tar.gz"
        tar -xzf "$RUNNER_TEMP/shardingsphere-hugo.tar.gz" -C "$RUNNER_TEMP/shardingsphere-hugo"
        echo "SHARDINGSPHERE_HUGO_BINARY=$RUNNER_TEMP/shardingsphere-hugo/hugo" >> "$GITHUB_ENV"

    - name: Run a multi-line script
      run: |
        echo start to deploy ss doc...
        bash .github/scripts/build-website.sh
