name: build docs PDF
on:
  workflow_dispatch:

jobs:
  build:
    name: publish PDF
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python Env
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    - name: generate PDF
      run: |
        bash .github/scripts/generate-pdf.sh
        
